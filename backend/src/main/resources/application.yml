spring:
  application:
    name: analyse-foot
  config:
    # Fichier .env facultatif à la racine du projet (ignoré par git) : LLM_KEY=...
    # Une variable d'environnement du même nom reste prioritaire.
    import: optional:file:.env[.properties]
  ai:
    mcp:
      # Serveur MCP « statsfoot » en lecture seule : SSE sur /sse (claude mcp add --transport sse statsfoot http://localhost:8080/sse)
      server:
        name: statsfoot
        version: 1.0.0
        type: SYNC
        instructions: >
          Statistiques du tournoi (dernière compétition importée), en lecture seule. Outils : metrics, rank, find,
          player_report, team_report. Les chiffres viennent de la base ; les données marquées fictives le sont.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analysefoot}
    username: ${DB_USERNAME:analysefoot}
    password: ${DB_PASSWORD:analysefoot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

# Assistant LLM de l'onglet Analyse (ChatClient de Spring AI, format OpenAI) : il interprète librement toute saisie qui n'est
# pas un nom de joueur ou d'équipe, avec les tools de lecture (metrics, rank, stat, find, player_report, team_report, matches,
# calculate) exécutés par l'application. Fournisseur au choix de LLM_PROVIDER :
#  - proxy (défaut) : LLM du projet, proxy LiteLLM de l'équipe, clé LLM_KEY ;
#  - bedrock : Amazon Bedrock (gpt-oss), jeton AWS_BEARER_TOKEN_BEDROCK.
# Désactivé sans clé. Les clés se donnent dans le fichier .env ou en variable d'environnement, jamais dans le dépôt.
# Aucun plafond d'appels par minute (au plus 6 allers et retours LLM, tool par saisie).
analyse:
  assistant:
    provider: ${LLM_PROVIDER:proxy}
    # Spring AI ajoute /v1/chat/completions à l'adresse
    api-key: ${LLM_KEY:}
    base-url: ${LLM_BASE_URL:https://g3jnmn4dyf.eu-west-3.awsapprunner.com}
    model: ${LLM_MODEL:claude-sonnet-4-6}
    # délai d'un appel au modèle (plusieurs par saisie)
    timeout: ${LLM_TIMEOUT:20s}
    max-tokens: ${LLM_MAX_TOKENS:400}
    bedrock:
      api-key: ${AWS_BEARER_TOKEN_BEDROCK:}
      base-url: ${BEDROCK_BASE_URL:https://bedrock-runtime.us-west-2.amazonaws.com/openai}
      model: ${BEDROCK_MODEL:openai.gpt-oss-120b-1:0}
      # gpt-oss raisonne : ses jetons de réflexion comptent dans ce plafond
      max-tokens: ${BEDROCK_MAX_TOKENS:1024}

# Trace des échanges (appli, LLM, tool rank, MCP, SQL) : journalisée (logger analyse.trace) et renvoyée à l'interface.
# Elle contient la question saisie : mettre ANALYSE_TRACE=false pour ne plus la journaliser.
analyse.trace.enabled: ${ANALYSE_TRACE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
