spring:
  application:
    name: analyse-foot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analysefoot}
    username: ${DB_USERNAME:analysefoot}
    password: ${DB_PASSWORD:analysefoot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
