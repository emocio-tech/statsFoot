spring:
  application:
    name: analyse-foot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analysefoot}
    username: ${DB_USERNAME:analysefoot}
    password: ${DB_PASSWORD:analysefoot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

# Assistant d'interprétation des questions libres (tool Claude rank) ; désactivé sans clé.
# La clé se donne par la variable d'environnement ANTHROPIC_API_KEY, jamais dans le dépôt.
analyse:
  assistant:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-5-5
    timeout: 3s
    max-per-minute: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
