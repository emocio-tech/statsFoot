spring.application.name=stats-foot

# Tests use an in-memory H2 database (never data/h2/) filled from the real versioned data file.
statsfoot.data-file=data/donneesStats.json
statsfoot.database-file=data/h2/unused-in-tests

spring.datasource.url=jdbc:h2:mem:statsfoot-test;MODE=PostgreSQL;NON_KEYWORDS=MINUTE,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
