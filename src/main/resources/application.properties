spring.application.name=stats-foot

# Database location (H2 file) and source file of the first import
statsfoot.database-file=./data/h2/statsfoot
statsfoot.data-file=data/donneesStats.json

spring.datasource.url=jdbc:h2:file:${statsfoot.database-file};MODE=PostgreSQL;NON_KEYWORDS=MINUTE,VALUE
spring.datasource.username=sa
spring.datasource.password=

# The schema comes from db/schema.sql; no connection is opened while the context starts,
# so an unreadable database gives a 503 and not a startup crash.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
