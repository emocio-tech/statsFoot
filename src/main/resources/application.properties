spring.application.name=stats-foot

statsfoot.data-dir=data
statsfoot.player-source=json
# JPA and DataSource are disabled by default; the database source is enabled later with statsfoot.player-source=database
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

spring.config.import=optional:file:.env[.properties]

spring.ai.openai.api-key=${LLM_KEY}
spring.ai.openai.base-url=https://g3jnmn4dyf.eu-west-3.awsapprunner.com/v1
spring.ai.openai.chat.options.model=nova-lite
