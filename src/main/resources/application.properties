spring.application.name=stats-foot

# Database location (H2 file) and source file of the first import
statsfoot.database-file=./data/h2/statsfoot
statsfoot.data-file=data/donneesStats.json

spring.datasource.url=jdbc:h2:file:${statsfoot.database-file};MODE=PostgreSQL;NON_KEYWORDS=MINUTE,VALUE
spring.datasource.username=sa
spring.datasource.password=

# The schema comes from db/schema.sql; no connection is opened while the context starts,
# so an unreadable database gives a 503 and not a startup crash.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

statsfoot.data-dir=data

spring.config.import=optional:file:.env[.properties]

spring.ai.openai.api-key=${LLM_KEY}
spring.ai.openai.base-url=https://g3jnmn4dyf.eu-west-3.awsapprunner.com/v1
spring.ai.openai.chat.options.model=nova-lite

# Log the prompt and the answer of each chat call (SimpleLoggerAdvisor) and the tool calls
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.model.tool=DEBUG

# Configuration for MCP
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=statsfoot-mcp
spring.ai.mcp.server.version=1.0.0
